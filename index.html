:root{--bg:#eef1f7;--card:#fff;--ac:#3b5bfd;--d:#ffdf8e;--n:#9fb4f2;--w:#eceff5;--sh:0 1px 2px rgba(20,30,70,.05),0 8px 22px rgba(20,30,70,.06)}

.c.sel{animation:pop .3s}

html,body{height:100%;overflow:hidden;overscroll-behavior:none}

/* ===== iOS skin ===== */
:root{--bg:#f2f2f7;--card:#fff;--tx:#000;--mut:#8e8e93;--bd:rgba(60,60,67,.16);--ac:#007aff;--w:#f2f2f7;--d:#ffe28a;--n:#b3d4ff;--ok:#d8f3de;--sh:none;--segon:#fff;--g:#34c759;--r:#ff3b30;--o:#ff9500}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--tx:#fff;--mut:#98989f;--bd:rgba(84,84,88,.55);--ac:#0a84ff;--w:#2c2c2e;--d:#6b5a1c;--n:#27507c;--ok:#1f3a27;--sh:none;--segon:#636366}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#fff;--mut:#98989f;--bd:rgba(84,84,88,.55);--ac:#0a84ff;--w:#2c2c2e;--d:#6b5a1c;--n:#27507c;--ok:#1f3a27;--sh:none;--segon:#636366}
html,body{font-family:-apple-system,"SF Pro Text","SF Pro Display",system-ui,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{-webkit-appearance:none;appearance:none;font-family:inherit}
button:active{transform:scale(.97);opacity:.7}
input:focus,select:focus,textarea:focus{outline:none}

/* карточки: inset grouped */
.card{border-radius:18px;border:0;box-shadow:none}
.card:not(#ed)>h2,.gh{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.gh{margin:18px 0 4px}.gh:first-child{margin-top:0}

/* верхняя панель */
.head{border-radius:0;max-width:520px;background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);box-shadow:none;border-bottom:.5px solid var(--bd)}
.head h1{font-size:18px;font-weight:600;letter-spacing:-.02em}
.nav{width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--ac);font-size:30px;line-height:1;padding:0 0 4px}
.nav:active{background:var(--w);transform:none;opacity:1}

/* календарь */
.cal .hd{font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.cal .hd.we{color:var(--r)}
.c{border-radius:10px}
.c.sel{transform:none;box-shadow:none;border-color:var(--ac)}
.c.hc::after{background:var(--r)}
.msum{border-radius:12px}

/* сегменты как UISegmentedControl */
.seg{background:var(--w);padding:2px;border-radius:10px;gap:2px}
.seg button{background:transparent;border:0;border-radius:8px;color:var(--tx);box-shadow:none}
.seg button.on{background:var(--segon);color:var(--ac);box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.04)}
#ed .seg{margin:4px 0}

/* кнопки и поля */
.bkb{background:var(--w);color:var(--ac);border:0;border-radius:12px;font-weight:600;min-height:44px;display:flex;align-items:center;justify-content:center}
.cb{background:var(--ac);color:#fff;border:0;border-radius:12px;font-weight:600}
.cb.done{background:var(--g)}
.row input,.row select,#ed input.w{background:var(--w);border:0;border-radius:10px}
.step button{background:var(--w);border:0;border-radius:50%;color:var(--ac)}
.step button:active{opacity:.6}

/* строки списков */
.s{border-bottom:.5px solid var(--bd)}
.earn{border-bottom:.5px solid var(--bd)}
.tot{border-radius:12px}
.bks{border-radius:12px;background:var(--w)}
.bks.g i{background:var(--g)}.bks.w i{background:var(--o)}.bks.r i{background:var(--r)}
.dots button.bw::after{background:var(--o)}.dots button.br::after{background:var(--r)}

/* нижняя панель вкладок как UITabBar */
.dots{gap:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border:0;border-top:.5px solid var(--bd);border-radius:0;box-shadow:none;background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}
.dots button,.dots button.on,.dots button.qb,.dots button.qb.on{flex:1;flex-direction:column;gap:2px;background:transparent;border:0;border-radius:10px;padding:4px 0;color:var(--mut);transition:color .2s,transform .12s}
.dots button.on{color:var(--ac)}
.dots svg,.dots button svg{width:26px;height:26px;stroke-width:1.7}
.dots em,.dots button.on em{max-width:none;opacity:1;overflow:visible;display:block;font-size:10px;font-weight:500;letter-spacing:0}
.dots button.qb::before{content:"Правка";order:2;font-size:10px;font-weight:500;letter-spacing:0}
.dots button.bw::after,.dots button.br::after{top:2px;right:calc(50% - 20px);border-color:var(--bg)}

/* ===== iOS: структура блоков ===== */
.card.grp{padding:0 16px;overflow:hidden}
.gh{padding:0 16px;margin:20px 0 6px}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;box-sizing:border-box;margin:0;border-bottom:.5px solid var(--bd);font-size:16px}

:root[data-theme="dark"] .dots::before{box-shadow:0 2px 10px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 1px rgba(255,255,255,.05)}

<script>
const MI=(y,m)=>y*12+m-1,MA=i=>[Math.floor(i/12),i%12+1];

const $=s=>document.querySelector(s);

const LK="shiftplanner.v1";
let S={ts:0,m:{}},cur=2,sel=1,ref=null,tm=null;
function mig(s){let ch=false;if(!s.v3){for(const k in s.m){const dd=(s.m[k]&&s.m[k].d)||{};for(const d in dd){const o=dd[d];if(o&&!o.s&&o.h)o.h=""}}s.v3=1;ch=true}if(!s.v4){for(const k in s.m){const dd=(s.m[k]&&s.m[k].d)||{};for(const d in dd){const o=dd[d];if(o&&o.r>3)o.r=3}}s.v4=1;ch=true}if(s.v2)return ch;for(const k in s.m){const p=k.split("-").map(Number),st=s.m[k]&&s.m[k].set;if(st&&p[0]*100+p[1]>=202611){st.rw=30;st.re=40;ch=true}}s.v2=1;return ch}
try{const j=JSON.parse(localStorage.getItem(LK));if(j&&j.m)S=j}catch(e){}
if(mig(S)&&hasData(S)){S.ts=Date.now();try{localStorage.setItem(LK,JSON.stringify(S))}catch(e){}}
const now=new Date();const ix=MI(now.getFullYear(),now.getMonth()+1);
if(ix>=0){cur=ix;sel=now.getDate()}
const Y=()=>MA(cur)[0],MO=()=>MA(cur)[1],ND=()=>new Date(Y(),MO(),0).getDate();
const wdOf=d=>(new Date(Y(),MO()-1,d).getDay()+6)%7;
function M(){const k=Y()+"-"+MO();return S.m[k]||(S.m[k]={set:{...DEF,...(Y()*100+MO()>=202611?{rw:30,re:40}:{}),...(S.tpl&&cur>S.tpl.i?S.tpl.set:{})},d:{}})}
function hrs(m,d){const o=m.d[d]||{};if(!o.s)return 0;if(o.h!==undefined&&o.h!==""&&!isNaN(f(o.h)))return f(o.h);const s=m.set;return o.s==="D"?mod(s.de-s.ds):o.s==="N"?mod(s.ne-s.ns):0}
const rate=m=>(m.set.stu==="да"?m.set.rs:m.set.rn)+(m.set.abs==="да"?0:m.set.bn);
const rideOf=(m,d)=>{const r=(m.d[d]||{}).r||0;return r*(wdOf(d)>=5?m.set.re:m.set.rw)};
function save(){S.ts=Date.now();bkUpd();try{localStorage.setItem(LK,JSON.stringify(S))}catch(e){}clearTimeout(tm);tm=setTimeout(push,800)}
async function push(){if(syOn()){syncNow();return}if(ref){try{await ref.set({json:JSON.stringify(S)})}catch(e){}}}
const isCurMonth=()=>{const n=new Date();return n.getFullYear()===Y()&&n.getMonth()+1===MO()};
function renderHead(){const t=$("#t");t.textContent=RU[MO()-1]+" "+Y();t.className="";void t.offsetWidth;t.className=(isCurMonth()?"cm ":"")+"sl"}
const manH=o=>!!o.s&&o.h!==undefined&&o.h!==""&&!isNaN(f(o.h));
const ci=(p,c)=>`<svg class="ic${c?" "+c:""}" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const SUN=`<circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>`,MOON=`<path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z" fill="currentColor"/>`,CAR=`<path d="M5 17H3v-5l2-5h14l2 5v5h-2M3 12h18M9 17h6"/><circle cx="7" cy="17" r="1.6"/><circle cx="17" cy="17" r="1.6"/>`,CMT=`<path d="M4 5h16v11H9l-5 4z"/>`,HOME=`<path d="M3 11.5L12 4l9 7.5M5.5 10v10h13V10M10 20v-5.5h4V20"/>`;
const CLK=`<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>`;
const cellIn=o=>`<span>${o.s==="D"?ci(SUN,"sun"):o.s==="N"?ci(MOON,"moon"):""}</span><i>${manH(o)?hh(f(o.h)):""}</i><em>${Array.from({length:Math.min(3,o.r||0)},()=>`<span>${ci(CAR)}</span>`).join("")}</em><em class="r">${(o.c||"").trim()?`<span>${ci(CMT)}</span>`:""}</em>`;
function LD(off,nd){const e=6-Math.ceil((off+nd)/7);return off+7*(off===0&&e===1?1:Math.floor(e/2))}
function adjCell(y,mo,d){const pd=S.m[y+"-"+mo],o=pd&&pd.d[d]||{};return `<div class="c adj${pd&&o.s?" "+o.s:""}"><b>${d}</b>${cellIn(o)}</div>`}
function calHTML(idx){const sc=cur;cur=idx;try{const m=S.m[Y()+"-"+MO()]||{d:{}},off=wdOf(1);let h="";
const lead=LD(off,ND()),trail=42-lead-ND();for(let i=0;i<lead;i++){const a=new Date(Y(),MO()-1,1-lead+i);h+=adjCell(a.getFullYear(),a.getMonth()+1,a.getDate())}
for(let d=1;d<=ND();d++){const o=m.d[d]||{},L=o.s||"w";h+=`<div class="c ${o.s||""}${o.s&&isFut(Y(),MO(),d)?" fut":""}${d===(idx===sc?sel:-1)?" sel":""}${isCurMonth()&&d===new Date().getDate()?" today":""}" data-a="day" data-d="${d}"><b>${d}</b>${cellIn(o)}</div>`}
for(let i=1;i<=trail;i++){const a=new Date(Y(),MO()-1,ND()+i);h+=adjCell(a.getFullYear(),a.getMonth()+1,a.getDate())}
return h}finally{cur=sc}}
function renderCal(){$("#cc").innerHTML=calHTML(cur)}
function info(){const m=M(),h=hrs(m,sel),e=$("#inf");let H=0;for(let d=1;d<=ND();d++)H+=hrs(m,d);if(e)e.innerHTML=`<span>Смена: ${money(h*rate(m))} · ${ci(CAR)} ${money(rideOf(m,sel))}</span>`}
function renderEd(){const m=M(),o=m.d[sel]||{},auto=o.s==="D"?mod(m.set.de-m.set.ds):o.s==="N"?mod(m.set.ne-m.set.ns):0;
$("#ed").innerHTML=`<div class="edh"><h2>${WD[wdOf(sel)]}, ${sel} ${RU[MO()-1].toLowerCase().replace(/ь$/,"я").replace(/т$/,"та").replace(/й$/,"я")}</h2><div class="info" id="inf"></div></div>
<div class="seg"><button data-a="sh" data-v="D" aria-label="День" class="${o.s==="D"?"on":""}">${ci(SUN)}<span>День</span></button><button data-a="sh" data-v="N" aria-label="Ночь" class="${o.s==="N"?"on":""}">${ci(MOON)}<span>Ночь</span></button></div>
<div class="grp"><div class="li"><span class="lbl">${ci(CAR)}Довоз</span><span class="rt"><b class="val">${o.r||0}</b><span class="stp"><button data-a="rd" data-v="-1" aria-label="Меньше">−</button><button data-a="rd" data-v="1" aria-label="Больше">+</button></span></span></div>
<label class="li"><span class="lbl">${ci(CLK)}Часы</span><input data-f="h" inputmode="decimal"${o.s?"":" disabled"} placeholder="${auto?hh(auto):"авто"}" value="${esc(o.h||"")}"></label>
<label class="li"><span class="lbl">Заметка</span><input class="wide" data-f="c" placeholder="Комментарий" value="${esc(o.c||"")}"></label></div>`;info()}
function renderSum(){const m=M(),nd=ND(),r=rate(m);let H=0,D=0,N=0,rd=0,rn=0,rp=0,rnW=0,rnE=0;
for(let d=1;d<=nd;d++){const o=m.d[d]||{};H+=hrs(m,d);if(o.s==="D")D++;if(o.s==="N")N++;if(o.r){rd++;rn+=o.r;rp+=rideOf(m,d);if(wdOf(d)>=5)rnE+=o.r;else rnW+=o.r}}
const wage=H*r,tot=wage+rp+m.set.prem-m.set.rent,row=(a,b)=>`<div class="s"><span>${a}</span><b>${b}</b></div>`;
const monthHTML=`<div class="tot s"><span>ТОТАЛЬНЫЙ ЗАРАБОТОК</span><span data-n="${tot}">${money(tot)}</span></div>`+earnedBar(m,tot)+row("Количество часов",hs(m,H))+row("Поездки (будни / выходные)",rnW+" / "+rnE)+row("Оплата за часы",money(wage))+row("Оплата за довоз",money(rp))+row("Смен D / N",D+" / "+N)+row("Премия",money(m.set.prem))+(()=>{const n2=x=>x.toFixed(2).replace(".",","),t=v=>(v<0?" − ":" + ")+n2(Math.abs(v)),pr=m.set.prem,rt=m.set.rent;let a=hh(H)+" × "+n2(r),w="оплата за часы";if(pr){a+=t(pr);w+=" + премия"}if(rp){a+=t(rp);w+=" + довоз"}if(rt){a+=t(-rt);w+=" − жильё"}return `<div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--bd);font-size:13px"><div>${a} = ${n2(tot)}</div><div style="margin-top:6px;color:var(--mut)">${w}</div></div>`})();
$("#stb").innerHTML=[["Итоги месяца",0],["За всё время",1]].map(([l,v])=>`<button data-a="st" data-v="${v}" class="${sumTab===v?"on":""}">${l}</button>`).join("");$("#sum").innerHTML=sumTab?allHTML(row):monthHTML;
let w=[],c=null;for(let d=1;d<=nd;d++){if(!c||wdOf(d)===0){c={a:d,b:d,h:0};w.push(c)}c.b=d;c.h+=hrs(m,d)}
$("#wk").innerHTML=w.map((x,i)=>row(`Неделя ${i+1}: ${p2(x.a)}.${p2(MO())} – ${p2(x.b)}.${p2(MO())}`,hh(x.h)+" ч")).join("")+row("Всего",hh(H)+" ч");$("#ms").innerHTML=`<b>${money(tot)}</b><b>${hs(m,H)} ч</b>`;const kk=cur+"|"+sumTab;if(pg===1&&kk!==lastK){lastK=kk;cu()}}
function allHTML(row){let n=0,H=0,D=0,N=0,rnW=0,rnE=0,wage=0,rp=0,prem=0,rent=0;
for(const k in S.m){const mm=S.m[k];if(!mm||!mm.d||!mm.set)continue;const p=k.split("-").map(Number),nd=new Date(p[0],p[1],0).getDate();let act=false,h=0;
for(let d=1;d<=nd;d++){const o=mm.d[d]||{};if(!o.s&&!o.r)continue;act=true;h+=hrs(mm,d);if(o.s==="D")D++;if(o.s==="N")N++;if(o.r){if((new Date(p[0],p[1]-1,d).getDay()+6)%7>=5){rnE+=o.r;rp+=o.r*mm.set.re}else{rnW+=o.r;rp+=o.r*mm.set.rw}}}

const tot=wage+rp+prem-rent,n2=x=>x.toFixed(2).replace(".",","),t=v=>(v<0?" − ":" + ")+n2(Math.abs(v));
let a=n2(wage),w="оплата за часы";if(prem){a+=t(prem);w+=" + премия"}if(rp){a+=t(rp);w+=" + довоз"}if(rent){a+=t(-rent);w+=" − жильё"}
return `<div class="tot s"><span>ВСЕГО ЗАРАБОТАНО</span><span>${money(tot)}</span></div>`+row("Месяцев с данными",n)+row("Среднее за месяц",money(tot/n))+row("Количество часов",hh(H))+row("Поездки (будни / выходные)",rnW+" / "+rnE)+row("Оплата за часы",money(wage))+row("Оплата за довоз",money(rp))+row("Смен D / N",D+" / "+N)+row("Премии",money(prem))+row("Потрачено на жильё",money(rent))+`<div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--bd);font-size:13px"><div>${a} = ${n2(tot)}</div><div style="margin-top:6px;color:var(--mut)">${w}</div></div>`}
function bkRender(msg,pending){$("#bk").innerHTML=bkPill()+`<button class="lbtn" data-a="bksave">Сохранить копию</button><label class="lbtn">Восстановить из файла<input type="file" id="bkf" accept=".json,application/json" hidden></label>${pending?`<button class="lbtn bad" data-a="bkok">Заменить данные</button><button class="lbtn" data-a="bkno">Отмена</button>`:""}${msg?`<div class="ft in">${msg}</div>`:""}`}
